<title>Apartment Search 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@400;600&display=swap">
<style>
/* Layout: a freeway-sign header over a two-pane workbench — weights on the left, ranked buildings / map / areas / compare on the right. */
:root {
  --bg: #eef1ee;
  --panel: #ffffff;
  --fg: #1b2420;
  --muted: #5b6862;
  --line: #d3dbd6;
  --sign: #0e6a47;          /* Caltrans guide-sign green */
  --sign-fg: #ffffff;
  --accent: #0e6a47;
  --accent-soft: #dcefe5;
  --shield: #1f4f9c;        /* interstate-shield blue, used for freeway tags */
  --shield-red: #b4262c;
  --ok: #1f7a4a;  --ok-bg: #def3e6;
  --warn: #9a6400; --warn-bg: #fbefd2;
  --bad: #b3261e;  --bad-bg: #fbe1de;
  --water: #d6e5ee;
  --land: #f7f8f5;
  --road: #b9c3bd;
  --font-display: "Overpass", "Highway Gothic", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Overpass", "Helvetica Neue", Arial, sans-serif;
  --font-data: "Overpass Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --panel: #19201c; --fg: #e3eae5; --muted: #98a69e; --line: #2c3631;
    --sign: #0b5a3c; --sign-fg: #f4fbf7; --accent: #4cc08b; --accent-soft: #173a2a;
    --shield: #7ea6ec; --shield-red: #ef7b7f;
    --ok: #6fd39c; --ok-bg: #173a27; --warn: #f0be5a; --warn-bg: #3a2e12; --bad: #f08a82; --bad-bg: #3e1b18;
    --water: #16242d; --land: #1a211d; --road: #3b4842;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --panel: #19201c; --fg: #e3eae5; --muted: #98a69e; --line: #2c3631;
  --sign: #0b5a3c; --sign-fg: #f4fbf7; --accent: #4cc08b; --accent-soft: #173a2a;
  --shield: #7ea6ec; --shield-red: #ef7b7f;
  --ok: #6fd39c; --ok-bg: #173a27; --warn: #f0be5a; --warn-bg: #3a2e12; --bad: #f08a82; --bad-bg: #3e1b18;
  --water: #16242d; --land: #1a211d; --road: #3b4842;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
}
.wrap {
  max-width: 1320px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 48px;
  display: grid; gap: 16px;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h2 { font-size: 1.15rem; font-weight: 800; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* ---------- Sign header ---------- */
.sign {
  background: var(--sign); color: var(--sign-fg);
  border-radius: 10px; padding: 6px;
}
.sign-inner {
  border: 2px solid var(--sign-fg); border-radius: 7px;
  padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 12px 24px;
  align-items: center; justify-content: space-between;
}
.sign h1 { font-size: clamp(1.5rem, 3.6vw, 2.3rem); font-weight: 800; letter-spacing: .01em; }
.sign .sub { font-size: .9rem; opacity: .9; }
.exit-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.exit {
  border: 2px solid var(--sign-fg); border-radius: 5px; padding: 4px 10px;
  display: grid; text-align: center; min-width: 96px;
}
.exit b { font-family: var(--font-display); font-size: 1.35rem; line-height: 1.1; }
.exit span { font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; }

/* ---------- Summary strip ---------- */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 2px; }
.stat b { font-family: var(--font-data); font-size: 1.4rem; font-weight: 600; }
.stat small { color: var(--muted); font-size: .8rem; }

/* ---------- Workbench ---------- */
.bench { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .bench { grid-template-columns: minmax(0, 1fr); } }
.side { display: grid; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 900px) { .side { position: static; } }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 12px; min-width: 0; }
details.box > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details.box > summary::-webkit-details-marker { display: none; }
details.box > summary::after { content: "–"; font-weight: 700; color: var(--muted); }
details.box:not([open]) > summary::after { content: "+"; }

.weight { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.weight label { font-weight: 600; font-size: .9rem; }
.weight output { font-family: var(--font-data); font-size: .85rem; color: var(--muted); }
.weight input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.weight small { grid-column: 1 / -1; color: var(--muted); font-size: .76rem; line-height: 1.3; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
  padding: 3px 11px; font-size: .84rem; cursor: pointer;
}
.chip-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); font-weight: 700; }
.field { display: grid; gap: 4px; }
.field label { font-size: .82rem; font-weight: 600; }
.field input, .field select, .field textarea {
  border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 6px 8px; width: 100%;
}
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.btn {
  border: 1px solid var(--accent); background: var(--accent); color: var(--panel);
  border-radius: 5px; padding: 7px 14px; font-weight: 700; cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }

/* ---------- Tabs ---------- */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 2px solid var(--line); }
.tab {
  border: 0; background: none; padding: 8px 14px; cursor: pointer; font-weight: 700;
  color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px;
  font-family: var(--font-display);
}
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab .count { font-family: var(--font-data); font-weight: 400; font-size: .8rem; margin-left: 4px; }
.pane { display: grid; gap: 12px; min-width: 0; }

/* ---------- Ranked list ---------- */
.list { display: grid; gap: 8px; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 4px 14px; padding: 12px 14px; align-items: center;
  cursor: pointer;
}
.card:hover { border-color: var(--accent); }
.card.fails { opacity: .62; }
.rank { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; color: var(--muted); text-align: center; }
.card .title { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.card .title h3 { font-size: 1.02rem; }
.card .meta { font-size: .84rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 12px; }
.card .right { display: grid; justify-items: end; gap: 4px; text-align: right; }
.price { font-family: var(--font-data); font-weight: 600; font-size: 1.05rem; }
.save { font-size: .78rem; font-family: var(--font-data); }
.save.pos { color: var(--ok); } .save.neg { color: var(--bad); }
.card .req { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
@media (max-width: 560px) {
  .card { grid-template-columns: 34px minmax(0, 1fr); }
  .card .right { grid-column: 2; justify-items: start; text-align: left; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
}

.scorebar { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-data); font-size: .85rem; font-weight: 600; }
.scorebar i { display: block; width: 64px; height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.scorebar i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--accent); }

.pill { font-size: .72rem; font-weight: 700; padding: 1px 7px; border-radius: 4px; border: 1px solid transparent; white-space: nowrap; letter-spacing: .02em; }
.pill.yes { background: var(--ok-bg); color: var(--ok); }
.pill.unclear { background: var(--warn-bg); color: var(--warn); }
.pill.no { background: var(--bad-bg); color: var(--bad); text-decoration: line-through; }
.pill.rep { text-decoration: none; }
.pill.status { background: var(--accent-soft); color: var(--fg); }
.pill.you { border-color: var(--line); color: var(--muted); }
.verdict { font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; }
.verdict.all { background: var(--ok); color: var(--panel); }
.verdict.check { background: var(--warn-bg); color: var(--warn); }
.verdict.fail { background: var(--bad-bg); color: var(--bad); }

.shield {
  display: inline-block; font-family: var(--font-display); font-weight: 800; font-size: .74rem;
  color: #fff; background: var(--shield); border-radius: 3px 3px 9px 9px; padding: 1px 6px 2px;
  border-top: 3px solid var(--shield-red);
}
.shield.ca { background: var(--sign); border-top-color: var(--sign); border-radius: 9px 9px 4px 4px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.toolbar select { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 5px 8px; }
.empty { padding: 28px; text-align: center; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: var(--radius); }

/* ---------- Map ---------- */
.mapwrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; position: relative; }
.mapwrap svg { width: 100%; height: auto; display: block; }
.map-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .8rem; color: var(--muted); padding: 6px 4px 2px; }
.map-legend span { display: inline-flex; gap: 6px; align-items: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.tip {
  position: absolute; pointer-events: none; background: var(--fg); color: var(--bg);
  padding: 6px 9px; border-radius: 5px; font-size: .8rem; max-width: 240px; z-index: 3;
}

/* ---------- Areas ---------- */
.areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.area { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 8px; cursor: pointer; align-content: start; }
.area:hover { border-color: var(--accent); }
.area header { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.big { font-family: var(--font-data); font-size: 1.5rem; font-weight: 600; line-height: 1; }
.minis { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 8px; align-items: center; font-size: .8rem; }
.minis i { height: 5px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; display: block; }
.minis i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--accent); }
.minis .num { color: var(--muted); }

/* ---------- Compare ---------- */
.tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--font-display); font-weight: 700; }
tbody th { color: var(--muted); font-weight: 600; white-space: nowrap; }
td.best { background: var(--accent-soft); }

/* ---------- Detail drawer ---------- */
.drawer-bg { position: fixed; inset: 0; background: rgba(10, 16, 13, .45); z-index: 10; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); z-index: 11;
  background: var(--bg); border-left: 1px solid var(--line); overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) 18px;
  display: grid; gap: 14px; align-content: start;
}
.drawer .close { justify-self: end; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; font-size: .88rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.factor { display: grid; gap: 4px; padding: 10px 0; border-top: 1px solid var(--line); }
.factor header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.factor p, .factor li { font-size: .86rem; }
.factor ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
.srcs { font-size: .78rem; overflow-wrap: anywhere; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; z-index: 20; font-size: .88rem; }
@media (prefers-reduced-motion: no-preference) {
  .card, .area { transition: border-color .15s; }
}
</style>

<div class="wrap">
  <header class="sign" aria-label="Apartment Search 2027">
    <div class="sign-inner">
      <div>
        <h1>Apartment Search 2027</h1>
        <p class="sub">LA · Long Beach · Orange County — 1BR, 700+ sq ft, rent $2,300 or less</p>
      </div>
      <div class="exit-tabs" id="exits"></div>
    </div>
  </header>

  <section class="summary" id="summary" aria-label="Summary"></section>

  <div class="bench">
    <aside class="side">
      <details class="box" open id="weightsBox">
        <summary><h2>What matters</h2></summary>
        <div id="weights" style="display:grid;gap:12px"></div>
        <button class="btn ghost" id="resetWeights" type="button">Reset to my priorities</button>
      </details>
      <details class="box" open>
        <summary><h2>Filters</h2></summary>
        <div class="field">
          <span class="label">Region</span>
          <div class="chips" id="regionChips"></div>
        </div>
        <div class="field">
          <label for="maxRent">Max rent after specials: <span class="num" id="maxRentOut"></span></label>
          <input type="range" id="maxRent" min="1600" max="2600" step="25" style="accent-color:var(--accent)">
        </div>
        <div class="field">
          <span class="label">Requirements</span>
          <div class="chips" id="verdictChips"></div>
        </div>
        <div class="field">
          <span class="label">My status</span>
          <div class="chips" id="statusChips"></div>
        </div>
      </details>
    </aside>

    <main class="pane">
      <div class="tabs" role="tablist" id="tabs"></div>
      <section id="view" class="pane" aria-live="polite"></section>
    </main>
  </div>
</div>

<div id="drawerRoot"></div>

<script>
(() => {
  /* ---------------- Fixed facts from the renewal letter ---------------- */
  const JAYNE = { allIn: 2726.83, rent: 2574, other: 152.83, monthToMonth: 2900.83 };
  const DATES = [
    { key: "offer", label: "Renewal offer expires", date: "2026-11-13" },
    { key: "notice", label: "Written notice due", date: "2026-12-30" },
    { key: "end", label: "Lease ends", date: "2027-01-29" },
  ];
  const RENT_CAP = 2300, MIN_SQFT = 700;

  /* ---------------- Scoring model ---------------- */
  const FACTORS = [
    { key: "drive",  name: "Freeway + traffic",     parts: ["freeway", "traffic"],              def: 30, hint: "On-ramp distance and how jammed the nearby roads get" },
    { key: "coffee", name: "Coffee + walkability",  parts: ["coffee", "walk"],                  def: 30, hint: "Specialty cafés within a 10-minute walk; Walk Score" },
    { key: "quiet",  name: "Quiet at home",         parts: ["quiet"],                           def: 15, hint: "Freeway, flight-path, helicopter, venue and bar noise" },
    { key: "safety", name: "Safety",                parts: ["safety"],                          def: 15, hint: "Crime per 1,000 residents vs. the LA average" },
    { key: "lax",    name: "LAX access",            parts: ["lax"],                             def: 5,  hint: "Off-peak drive to LAX" },
    { key: "extras", name: "Nightlife, gyms, errands", parts: ["nightlife", "gyms", "services"], def: 5,  hint: "Drive to a nightlife district; gyms and groceries nearby" },
  ];
  /* Building-level factor: resident reviews (management, maintenance, cleanliness, noise, security, pests, fees). */
  const REP = { key: "rep", name: "Building reputation", def: 20, hint: "Resident reviews and Reddit: management, repairs, cleanliness, security" };
  const REVIEW_PARTS = [
    ["management", "Management"], ["maintenance", "Maintenance"], ["cleanliness", "Cleanliness"],
    ["noise", "Noise"], ["security", "Security & packages"], ["pests", "Pests"], ["costs", "Fees & renewals"],
  ];
  const REQS = [
    { key: "wd", short: "W/D", name: "In-unit washer/dryer" },
    { key: "ac", short: "Central AC", name: "Central AC" },
    { key: "dw", short: "Dishwasher", name: "Dishwasher" },
    { key: "parking", short: "Parking", name: "Parking" },
    { key: "packages", short: "Packages", name: "Package lockers or room" },
  ];
  const STATUSES = [
    { key: "new", name: "Not reviewed" },
    { key: "watch", name: "Watching" },
    { key: "tour", name: "Tour" },
    { key: "applied", name: "Applied" },
    { key: "pass", name: "Passed on" },
  ];
  const REGIONS = ["Los Angeles", "Long Beach", "Orange County"];

  /* ---------------- State ---------------- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem("aps27:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("aps27:" + k, JSON.stringify(v)); } catch {} },
  };
  const defaultWeights = Object.fromEntries(FACTORS.concat(REP).map(f => [f.key, f.def]));
  const state = {
    buildings: [], areas: [], areaById: new Map(),
    weights: Object.assign({}, defaultWeights, store.get("weights", {})),
    regions: new Set(store.get("regions", REGIONS)),
    maxRent: store.get("maxRent", RENT_CAP),
    verdicts: new Set(store.get("verdicts", ["all", "check"])),
    statuses: new Set(store.get("statuses", STATUSES.filter(s => s.key !== "pass").map(s => s.key))),
    tab: (location.hash || "").replace("#", "") || "ranked",
    sort: store.get("sort", "score"),
    compare: new Set(store.get("compare", [])),
    db: null, canWrite: false, loaded: false, source: "",
  };

  /* ---------------- Tiny DOM helper ---------------- */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "text") el.textContent = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    return el;
  }
  const $ = id => document.getElementById(id);
  const money = n => n == null || isNaN(n) ? "—" : "$" + Math.round(n).toLocaleString("en-US");
  const fixed1 = n => n == null || isNaN(n) ? "—" : (Math.round(n * 10) / 10).toFixed(1);
  function toast(msg) {
    const t = h("div", { class: "toast", role: "status", text: msg });
    document.body.append(t); setTimeout(() => t.remove(), 2600);
  }

  /* ---------------- Derived values ---------------- */
  function areaScore(area, weights = state.weights) {
    if (!area) return null;
    let tot = 0, wsum = 0;
    for (const f of FACTORS) {
      const s = factorScore(area, f);
      const w = Number(weights[f.key]) || 0;
      if (s == null || !w) continue;
      tot += s * w; wsum += w;
    }
    return wsum ? tot / wsum : null;
  }
  function repScore(b) { const r = b.reviews; return r && typeof r.reputation_score === "number" ? r.reputation_score : null; }
  function buildingScore(b) {
    const a = areaScore(state.areaById.get(b.area_id));
    const r = repScore(b);
    const wa = FACTORS.reduce((t, f) => t + (Number(state.weights[f.key]) || 0), 0);
    const wr = Number(state.weights.rep) || 0;
    if (a == null) return r;
    if (r == null || !wr) return a;
    return (a * wa + r * wr) / (wa + wr);
  }
  function factorScore(area, f) {
    const vals = f.parts.map(p => area[p] && Number(area[p].score)).filter(v => typeof v === "number" && !isNaN(v));

  /* ---------------- Persistence ---------------- */
  async function saveBuilding(b, isNew) {
    const i = state.buildings.findIndex(x => x.id === b.id);
    if (i >= 0) state.buildings[i] = b; else state.buildings.push(b);
    renderAll(false);
    if (state.db && state.canWrite) {
      try {
        const ref = state.db.doc("buildings/" + b.id);
        if (isNew) await ref.set(b); else await ref.update({ my_status: b.my_status || "new", my_note: b.my_note || "" });
        return true;
      } catch (err) {
        if (err && err.code === "invalid_argument") state.canWrite = false;
        toast("Couldn't save. " + (err && err.code === "quota_exceeded" ? "Storage is full." : "Try again in a moment."));
        return false;
      }
    }
    // No shared store in this view: keep personal edits on this device.
    const local = store.get("localEdits", {});
    local[b.id] = isNew ? b : { my_status: b.my_status, my_note: b.my_note };
    store.set("localEdits", local);
    return true;
  }
  function applyLocalEdits() {
    const local = store.get("localEdits", {});
    for (const [id, patch] of Object.entries(local)) {
      const i = state.buildings.findIndex(x => x.id === id);
      if (i >= 0) state.buildings[i] = { ...state.buildings[i], ...patch };

    }
  }

    state.areaById = new Map(state.areas.map(a => [a.id, a]));
    state.buildings = buildings;
    state.loaded = true;
  }
  async function loadFiles() {
    try {
      const [b, a] = await Promise.all([fetch("data/buildings.json").then(r => r.json()), fetch("data/neighborhoods.json").then(r => r.json())]);
      setData(b, a); applyLocalEdits(); state.canWrite = true; state.source = "files";
    } catch { state.loaded = true; }
    renderAll();
  }
  async function boot() {
    renderExits(); renderWeights(); renderFilters(); renderAll();
    const claude = window.claude;

    state.db = db;

  }

})();
