<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apartment Search 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: quiet header, one wide search field, filters in a left column, results on the right as list, table or map. */
:root {
  --bg: #f5f5f2;           /* cool paper */
  --surface: #ffffff;
  --ink: #1d2023;
  --muted: #6c7176;
  --faint: #9a9fa3;
  --line: #e2e3df;
  --birch: #ece7dc;        /* pale wood, used for hover and selected rows */
  --accent: #2c5a85;       /* muted Swedish blue */
  --accent-soft: #e5edf5;
  --ok: #3b7655;  --ok-bg: #e4f0e8;
  --warn: #8f6514; --warn-bg: #f5eedc;
  --bad: #a3433a;  --bad-bg: #f6e3e0;
  --water: #e3ebf0;
  --land: #fafaf8;
  --road: #cfd3d0;
  --font: "Albert Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --r: 3px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141618; --surface: #1b1e21; --ink: #e8e9e6; --muted: #9ba0a4; --faint: #6f7478; --line: #2b2f33;
    --birch: #26241f; --accent: #8db2d8; --accent-soft: #1d2a37;
    --ok: #7cc49a; --ok-bg: #1a2e22; --warn: #e2b862; --warn-bg: #33291a; --bad: #e88b80; --bad-bg: #3a1f1c;
    --water: #18232b; --land: #1b1e21; --road: #3a3f43;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141618; --surface: #1b1e21; --ink: #e8e9e6; --muted: #9ba0a4; --faint: #6f7478; --line: #2b2f33;
  --birch: #26241f; --accent: #8db2d8; --accent-soft: #1d2a37;
  --ok: #7cc49a; --ok-bg: #1a2e22; --warn: #e2b862; --warn-bg: #33291a; --bad: #e88b80; --bad-bg: #3a1f1c;
  --water: #18232b; --land: #1b1e21; --road: #3a3f43;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums; }
.wrap {
  max-width: 1360px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
  display: grid; gap: 28px;
}
h1, h2, h3 { margin: 0; font-weight: 600; line-height: 1.2; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.label { font-size: .7rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* ---------- Header ---------- */
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px 32px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.top h1 { font-size: clamp(1.6rem, 3vw, 2.1rem); font-weight: 500; }
.top .sub { color: var(--muted); margin-top: 4px; }
.dates { display: flex; flex-wrap: wrap; gap: 8px 28px; }
.date { display: grid; gap: 0; }
.date b { font-size: 1.25rem; font-weight: 500; }
.date span { font-size: .78rem; color: var(--muted); }
.date.soon b { color: var(--bad); }

/* ---------- Search ---------- */
.search { display: grid; gap: 10px; }
.searchbox { position: relative; }
.searchbox input {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r);
  padding: 14px 16px 14px 44px; font-size: 1.05rem;
}
.searchbox input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.searchbox svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--faint); }
.resultbar { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between; }
.resultbar .count { color: var(--muted); }
.resultbar .count b { color: var(--ink); font-weight: 600; }

/* ---------- Layout ---------- */
.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 36px; align-items: start; }
@media (max-width: 920px) { .layout { grid-template-columns: minmax(0, 1fr); gap: 20px; } }
.filters { display: grid; gap: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 32px); overflow-y: auto; padding-right: 4px; }
@media (max-width: 920px) { .filters { position: static; max-height: none; } }
.fgroup { border-top: 1px solid var(--line); padding: 14px 0; display: grid; gap: 10px; }
.fgroup:first-child { border-top: 0; padding-top: 0; }
.fgroup > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
.fgroup > summary::-webkit-details-marker { display: none; }
.fgroup > summary::after { content: "+"; color: var(--faint); font-weight: 400; }
.fgroup[open] > summary::after { content: "−"; }
.fhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.fhead output { font-size: .9rem; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.checks { display: grid; gap: 6px; }
.check { display: flex; gap: 9px; align-items: center; font-size: .92rem; cursor: pointer; }
.check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.check small { margin-left: auto; color: var(--faint); font-size: .8rem; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: .88rem; text-decoration: underline; text-underline-offset: 2px; }
.mobile-filters { display: none; }
@media (max-width: 920px) {
  .mobile-filters { display: block; }
  .filters[data-collapsed="true"] { display: none; }
}

/* ---------- Toolbar ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
@media (max-width: 560px) { .seg button { padding: 7px 10px; } }
.seg button { border: 0; background: none; padding: 7px 14px; cursor: pointer; color: var(--muted); font-size: .9rem; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
select.plain { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 7px 10px; font-size: .9rem; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 8px 16px; cursor: pointer; font-weight: 500; font-size: .92rem; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:disabled { opacity: .45; cursor: default; }
.main { display: grid; gap: 18px; min-width: 0; }
.layout > * { min-width: 0; }

/* ---------- List ---------- */
.list { display: grid; border-top: 1px solid var(--line); }
.row {
  display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 18px; align-items: start;
  padding: 18px 8px; border-bottom: 1px solid var(--line); cursor: pointer;
}
.row:hover { background: var(--birch); }
.row.fails { opacity: .55; }
.rank { color: var(--faint); font-size: .95rem; padding-top: 2px; }
.row h3 { font-size: 1.05rem; font-weight: 600; }
.row .where { color: var(--muted); font-size: .9rem; margin-top: 2px; }
.row .facts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .88rem; color: var(--muted); margin-top: 8px; }
.row .facts b { color: var(--ink); font-weight: 500; }
.row .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.row .price { text-align: right; display: grid; gap: 2px; }
.row .price b { font-size: 1.2rem; font-weight: 500; }
.row .price s { color: var(--faint); font-size: .82rem; }
.save { font-size: .82rem; }
.save.pos { color: var(--ok); } .save.neg { color: var(--bad); }
@media (max-width: 560px) {
  .row { grid-template-columns: 26px minmax(0, 1fr); }
  .row .price { grid-column: 2; text-align: left; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
}

.tag { font-size: .74rem; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; background: var(--surface); }
.tag.yes { border-color: transparent; background: var(--ok-bg); color: var(--ok); }
.tag.unclear { border-color: transparent; background: var(--warn-bg); color: var(--warn); }
.tag.no { border-color: transparent; background: var(--bad-bg); color: var(--bad); }
.tag.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tag.blue { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.score { display: inline-flex; align-items: center; gap: 7px; }
.score i { display: block; width: 56px; height: 4px; background: var(--line); border-radius: 2px; position: relative; overflow: hidden; }
.score i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--accent); }

.empty { padding: 48px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }

/* ---------- Table ---------- */
.tablewrap { overflow-x: auto; border-top: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
td.wrap { white-space: normal; min-width: 180px; }
th { font-weight: 500; color: var(--muted); font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; }
th button { background: none; border: 0; padding: 0; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
th[aria-sort] button { color: var(--ink); }
td.num, th.num { text-align: right; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--birch); }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dots i.yes { background: var(--ok); } .dots i.unclear { background: transparent; border: 1.5px solid var(--warn); } .dots i.no { background: var(--bad); }

/* ---------- Map ---------- */
.mapwrap { position: relative; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.mapwrap svg { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .82rem; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: var(--r); font-size: .8rem; max-width: 240px; z-index: 3; }

/* ---------- Areas ---------- */
.areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0 28px; border-top: 1px solid var(--line); }
.area { padding: 16px 4px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; gap: 10px; align-content: start; }
.area:hover { background: var(--birch); }
.area header { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.area h3 { font-size: 1rem; }
.big { font-size: 1.5rem; font-weight: 500; line-height: 1; }
.bars { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; font-size: .8rem; color: var(--muted); }
.bars i { height: 3px; background: var(--line); position: relative; display: block; border-radius: 2px; overflow: hidden; }
.bars i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--accent); }
.bars span:nth-child(3n) { color: var(--ink); text-align: right; }

/* ---------- Compare ---------- */
td.best { background: var(--accent-soft); }
.compare th:first-child, .compare td:first-child { position: sticky; left: 0; background: var(--bg); }

/* ---------- Drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(20, 22, 24, .35); z-index: 10; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100%); z-index: 11; overflow-y: auto;
  background: var(--surface); border-left: 1px solid var(--line); box-shadow: -16px 0 40px rgba(0,0,0,.08);
  padding: calc(env(safe-area-inset-top, 0px) + 22px) max(24px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 32px) 24px;
  display: grid; gap: 22px; align-content: start;
}
.drawer .close { justify-self: end; }
.drawer h2 { font-size: 1.55rem; font-weight: 500; }
.kv { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); gap: 8px 16px; font-size: .9rem; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.section { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 18px; }
.section h3 { font-size: .74rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.factor { display: grid; gap: 4px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.factor:last-child { border-bottom: 0; }
.factor header { display: flex; justify-content: space-between; gap: 8px; font-weight: 500; }
.factor p, .factor li { font-size: .88rem; color: var(--muted); }
.factor ul, .section ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: .88rem; }
.note { padding: 10px 12px; border-radius: var(--r); font-size: .88rem; }
.note.bad { background: var(--bad-bg); color: var(--bad); }
.note.warn { background: var(--warn-bg); color: var(--warn); }
.field { display: grid; gap: 5px; }
.field label { font-size: .84rem; color: var(--muted); }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--bg); border-radius: var(--r); padding: 8px 10px; width: 100%; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
.srcs { font-size: .8rem; overflow-wrap: anywhere; color: var(--muted); }
.foot { padding-block: 0 40px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center; border-top: 1px solid var(--line); padding-top: 20px; font-size: .88rem; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: var(--r); z-index: 20; font-size: .9rem; }
@media (prefers-reduced-motion: no-preference) { .row, .area, tbody tr { transition: background-color .12s; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Apartment Search 2027</h1>
      <p class="sub">Los Angeles, Long Beach and Orange County · one bedroom, 700 sq ft or more</p>
    </div>
    <div class="dates" id="dates"></div>
  </header>

  <section class="search" aria-label="Search">
    <div class="searchbox">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input id="q" type="search" placeholder="Search by building, street, neighborhood, landlord, feature…" aria-label="Search listings" autocomplete="off">
    </div>
    <div class="resultbar">
      <p class="count" id="count">Loading…</p>
      <p class="muted" id="baseline" style="font-size:.88rem"></p>
    </div>
  </section>

  <div class="layout">
    <aside>
      <button class="btn ghost mobile-filters" id="toggleFilters" type="button" aria-expanded="false" aria-controls="filters">Show filters</button>
      <div class="filters" id="filters" data-collapsed="true"></div>
    </aside>
    <main class="main">
      <div class="toolbar">
        <div class="seg" role="group" aria-label="View" id="views"></div>
        <label class="muted" style="display:flex;gap:8px;align-items:center;font-size:.9rem">Sort
          <select class="plain" id="sort"></select>
        </label>
      </div>
      <section id="view" aria-live="polite"></section>
    </main>
  </div>
</div>
<footer class="wrap foot">
  <p class="muted" id="dataDate"></p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <span class="muted" style="font-size:.88rem">Your statuses, notes and added listings are saved in this browser.</span>
    <button class="btn ghost" id="exportBtn" type="button">Export notes</button>
    <label class="btn ghost" for="importFile" style="cursor:pointer">Import notes</label>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
  </div>
</footer>
<div id="drawerRoot"></div>

wntown LA – Arts District","region":"Los Angeles","remote_work":{"remote_work_score":7,"cafes":"Groundwork Coffee Co. (Arts District): Organic specialty roaster. Free wifi and ample seating, described as a 'perfect place to work on your laptop' (Per Diem). BrewAtlas (2026) notes communal table… | Maru Coffee (Arts District): Top-tier specialty coffee. Wifi, a spacious communal table and free street parking (The Infatuation), but seating is limited, outlets are not at every seat and… | Verve Coffee Roasters (Arts District): BrewAtlas (June 2026): wifi reported, food menu, large industrial room with a patio, open layout that carries sound. Confirm the address before going. | Etiquette Coffee: Reliable wifi, plenty of seating and a quieter atmosphere (Orlagh Claire, Dec 2025). On the industrial southeast edge of the district. | RVCC Intersect: Blueground guide: communal tables and couches with plenty of outlets.","coworking":"Union Cowork - Arts District (1325 Palmetto St) ($35/day via Deskpass) | Spaces - 777 S Alameda ($69/day) | CENTRL Office - Downtown LA (360 E 2nd St, Ste 800) ($40/day via Deskpass) | Little Tokyo Branch Library (203 S Los Angeles St) (Free)","packages":"The housing mix is converted lofts, where package handling varies (some older conversions have open lobbies or mailrooms), and newer large complexes that usually have lockers. Ask each building. The district is in LAPD Central Area, where YTD 2026 larceny/theft is 2,161 and theft from motor vehicles 1,722. GNS Guard (Apr 2026, citing Crosstown) names Downtown among LA's top package-theft areas. No specific Amazon Locker or Counter was verified inside the district; check the Amazon app.","internet":"No neighborhood-level FCC page could be fetched for the Arts District. Nearby Civic Center/Little Tokyo shows AT&T Fiber and EarthLink at about 44.5%, BAI Connect about 42.5% and Spectrum fiber about 12.2%, with Starry fixed wireless about 49% and T-Mobile Home about 91%. Converted lofts can be poorly wn). Whole Foods (770 S Grand Ave) and other Amazon pickup points are nearby; specific Locker or Counter sites are unverified.","internet":"No neighborhood-specific FCC page could be fetched for the Historic Core or Bunker Hill. BroadbandNow says AT&T Fiber is weakest in Downtown LA. Nearby South Park shows Spectrum fiber about 57.5% and AT&T about 51%; Civic Center shows AT&T about 44.5%. Office-tower-adjacent residential buildings often have extra fiber options (BAI Connect, GeoLinks). Verify by address.","groceries":"Grand Central Market (317 S Broadway, food hall with produce stalls); Whole Foods Market (770 S Grand Ave); Ralphs (645 W 9th St); Target at FIGat7th (735 S Figueroa St). No Trader Joe's downtown."}},{"neighborhood":"Chinatown","lat":34.0625,"lng":-118.2385,"freeway":{"score":9,"nearest":["I-110/SR-110 (Hill St / Broadway ramps, ~2-3 min)","US-101 (Broadway/Alameda ramps, ~3-4 min)","I-5 (via N Broadway/Pasadena Ave, ~5-6 min)"],"note":"Sits between the 110 Pasadena Fwy, 101 and I-5. Estimates."},"traffic":{"score":4,"note":"Estimate: 101/110 four-level interchange and the 5/110 junction are congested at peak, Dodger Stadium game days jam Broadway/Hill and Stadium Way. Local arterials otherwise move better than the DTLA core."},"coffee":{"score":6,"cafes":["Endorffeine – Chinatown, serious multi-roaster, small (not laptop-friendly)","Steep / tea + coffee spots in Far East Plaza","Union Station area cafes (~10 min walk)","Little Tokyo cluster ~15 min walk"],"note":"1-3 genuine specialty cafes within 10 min; more in Little Tokyo/Arts District a short drive away."},"walk":{"score":9,"walk_score":90,"note":"Estimate (Walk Score not individually retrieved)."},"quiet":{"score":5,"note":"Generally calmer than DTLA core; noise from Metro A Line on elevated tracks, Dodger Stadium crowds/fireworks, freeway hum near 110/101, and helicopters. Jia (N Broadway) faces a busy arterial; The Orsini abuts the 110/101 corridor."},"safety":{"score":5,"violent_per_1k":nul n HB Walk Score not retrieved; HB city average is 56; nearby neighborhoods range 64-84 by address. Downtown core estimated ~80."},"quiet":{"score":5,"note":"Downtown Main St has bar crowds, summer/holiday events and frequent HBPD helicopter flights (HB has its own police air unit). Quieter residential areas a few blocks inland; ocean breeze and no freeway noise."},"safety":{"score":6,"violent_per_1k":2.5,"property_per_1k":23.0,"year":"recent (NeighborhoodScout-derived odds; FBI 2024 via Proximitii says violent 3.9/1k)","source":"NeighborhoodScout via local real estate site; Proximitii (FBI 2024)","note":"Sources disagree (violent 2.5-3.9/1k). Property crime is near the LA reference; downtown has more disorder on summer weekends."},"lax":{"score":5,"minutes_offpeak":35,"minutes_peak":75,"note":"I-405 N (~30 mi). Estimate."},"nightlife":{"score":10,"nearest_district":"Downtown HB Main St / Pacific City","drive_minutes":3,"note":"Costa Mesa 17th St ~15 min."},"gyms":{"score":8,"examples":["24 Hour Fitness (Huntington Beach)","LA Fitness (Huntington Beach)","Crunch Fitness (Huntington Beach)"]},"services":{"score":8,"note":"Trader Joe's, Whole Foods (Pacific City area), Ralphs, Target within ~5-10 min."},"rail":{"score":1,"nearest_station":"None practical (Santa Ana Metrolink ~25 min drive)","line":"none","note":"No rail."},"airports_other":"SNA ~18 min; LGB ~22 min (estimates)","summary":"A beach lifestyle with a walkable downtown and decent coffee, and LGB/LAX are relatively close. Trade-off for this client: it is the farthest from freeways (I-405 is 10+ min away and is itself a top OC bottleneck), and downtown gets noisy with bar crowds and helicopters.","sources":["https://mycoffeeexplorer.com/guides/huntington-beach","https://www.surfcityusa.com/blog/stories/post/2025-surf-city-usa-foodie-awards-best-coffee/","https://justinpluslauren.com/huntington-beach-coffee-shops/","https://www.proximitii.com/usa/ca/huntington+beach/","https://www.malakaisparks.com/homes-in-hu urants","drive_minutes":22,"note":"Few bars locally; Costa Mesa ~30 min."},"gyms":{"score":6,"examples":["24 Hour Fitness (RSM)","Local boutique studios","LA Fitness (Mission Viejo, ~10 min)"]},"services":{"score":7,"note":"RSM Town Center has Trader Joe's, Target, Walgreens, ULTA and a cinema; Santa Margarita Marketplace nearby."},"rail":{"score":1,"nearest_station":"Mission Viejo/Laguna Niguel Metrolink (~15-20 min drive)","line":"Metrolink Orange County line","note":"No practical rail."},"airports_other":"SNA ~22 min; LGB ~45 min (estimates)","summary":"The safest and quietest option in the set, with the 241 toll road as an escape valve. Trade-off for this client: very weak walkable coffee, a long drive to LAX (about an hour), and nightlife 20+ minutes away, so it fails the core coffee and walkability priority.","sources":["https://www.neighborhoodscout.com/ca/rancho-santa-margarita/crime","https://patch.com/california/across-ca/20-safest-cities-ca-2024-report","https://getsafeandsound.com/blog/safest-cities-in-california/","https://www.cbre.com/properties/properties-for-lease/retail/details/US-SMPL-130422/rancho-santa-margarita-town-center-30602-30616-santa-margarita-pky-rancho-santa-margarita-ca-92688","https://www.mylocalservices.com/Coffee+Shops-Rancho+Santa+Margarita-California.html","https://www.rome2rio.com/s/Rancho-Santa-Margarita/Crypto-com-Arena"],"id":"rancho-santa-margarita","name":"Rancho Santa Margarita","region":"Orange County"}]}</script>

<script>
(() => {
  /* ---------------- Facts from the renewal letter ---------------- */
  const JAYNE = { allIn: 2726.83 };
  const DATES = [
    { label: "Renewal offer expires", date: "2026-11-13" },
    { label: "Written notice due", date: "2026-12-30" },
    { label: "Lease ends", date: "2027-01-29" },
  ];
  const RENT_CAP = 2300, MIN_SQFT = 700;

  /* ---------------- Scoring model ---------------- */
  const FACTORS = [
    { key: "drive",  name: "Freeway and traffic",  parts: ["freeway", "traffic"], def: 30 },
    { key: "coffee", name: "Coffee and walking",   parts: ["coffee", "walk"], def: 30 },
    { key: "quiet",  name: "Quiet",                parts: ["quiet"], def: 15 },
    { key: "safety", name: "Safety",               parts: ["safety"], def: 15 },
    { key: "lax",    name: "LAX",                  parts: ["lax"], def: 5 },
    { key: "extras", name: "Nightlife, gyms, errands", parts: ["nightlife", "gyms", "services"], def: 5 },
  ];
  const REP = { key: "rep", name: "Building reviews", def: 20 };
  const REQS = [
    { key: "wd", short: "W/D", name: "In-unit washer/dryer" },
    { key: "ac", short: "Central AC", name: "Central AC" },
    { key: "dw", short: "Dishwasher", name: "Dishwasher" },
    { key: "parking", short: "Parking", name: "Parking" },
    { key: "packages", short: "Packages", name: "Package handling" },
  ];
  const REVIEW_PARTS = [["management", "Management"], ["maintenance", "Maintenance"], ["cleanliness", "Cleanliness"], ["noise", "Noise"], ["security", "Security"], ["pests", "Pests"], ["costs", "Fees and renewals"]];
  const STATUSES = [{ key: "new", name: "Not reviewed" }, { key: "watch", name: "Watching" }, { key: "tour", name: "Tour" }, { key: "applied", name: "Applied" }, { key: "pass", name: "Passed on" }];
  const REGIONS = ["Los Angeles", "Long Beach", "Orange County"];
  const VERDICTS = { all: "Meets everything", check: "Needs checks", fail: "Fails something" };
  const LANDLORDS = { company: "Management company", private: "Private owner" };
  const SORTS = [["score", "Best match"], ["value", "Best match per dollar"], ["rent", "Lowest rent"], ["sqft", "Largest"], ["ppsf", "Lowest $/sq ft"], ["reviews", "Best reviewed"], ["name", "Name"]];
  const VIEWS = [["list", "List"], ["table", "Table"], ["map", "Map"], ["areas", "Neighborhoods"], ["compare", "Compare"], ["add", "Add"]];

  /* ---------------- Persistence for filters ---------------- */
  const ls = {
    get(k, d) { try { const v = localStorage.getItem("aps27b:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("aps27b:" + k, JSON.stringify(v)); return true; } catch { return false; } },
  };
  const DEFAULT_FILTERS = {
    maxRent: RENT_CAP, minSqft: MIN_SQFT, minRep: 0,
    regions: REGIONS.slice(), verdicts: ["all", "check"], landlords: ["company", "private"],
    statuses: ["new", "watch", "tour", "applied"], mustHave: [], hideScam: true, newOnly: false,
  };
  const defaultWeights = Object.fromEntries(FACTORS.concat(REP).map(f => [f.key, f.def]));
  const S = {
    buildings: [], areas: [], areaById: new Map(),
    f: Object.assign({}, DEFAULT_FILTERS, ls.get("filters", {})),
    weights: Object.assign({}, defaultWeights, ls.get("weights", {})),
    q: "", view: ls.get("view", "list"), sort: ls.get("sort", "score"),
    tsort: ls.get("tsort", { key: "score", dir: -1 }),
    compare: new Set(ls.get("compare", [])),
    db: null, canWrite: false, loaded: false,
  };
  const saveF = () => ls.set("filters", S.f);

  /* ---------------- Helpers ---------------- */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "text") el.textContent = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    return el;
  }
  const $ = id => document.getElementById(id);
  const money = n => n == null || isNaN(n) ? "—" : "$" + Math.round(n).toLocaleString("en-US");
  const f1 = n => n == null || isNaN(n) ? "—" : (Math.round(n * 10) / 10).toFixed(1);
  const toast = msg => { const t = h("div", { class: "toast", role: "status", text: msg }); document.body.append(t); setTimeout(() => t.remove(), 2400); };
  const linkOut = (url, text) => url ? h("a", { href: url, target: "_blank", rel: "noopener", text: text || url }) : null;
  const ul = items => items && items.length ? h("ul", null, ...items.map(t => h("li", { text: t }))) : null;

  /* ---------------- Derived values ---------------- */
  const factorScore = (a, f) => { const v = f.parts.map(p => a && a[p] && Number(a[p].score)).filter(x => typeof x === "number" && !isNaN(x)); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
  function areaScore(a) {
    if (!a) return null; let t = 0, w = 0;
    for (const f of FACTORS) { const s = factorScore(a, f), wt = Number(S.weights[f.key]) || 0; if (s == null || !wt) continue; t += s * wt; w += wt; }
    return w ? t / w : null;
  }
  const repScore = b => b.reviews && typeof b.reviews.reputation_score === "number" ? b.reviews.reputation_score : null;
  function score(b) {
    const a = areaScore(S.areaById.get(b.area_id)), r = repScore(b);
    const wa = FACTORS.reduce((t, f) => t + (Number(S.weights[f.key]) || 0), 0), wr = Number(S.weights.rep) || 0;
    if (a == null) return r; if (r == null || !wr) return a;
    return (a * wa + r * wr) / (wa + wr);
  }
  const rentOf = b => b.effective_rent ?? b.base_rent;
  const allIn = b => { const r = rentOf(b); return r == null ? null : r + (Number(b.parking_fee) || 0); };
  const ppsf = b => rentOf(b) && b.sqft ? rentOf(b) / b.sqft : null;
  const reqVal = (b, k) => { const v = b.req && b.req[k]; return v === "yes" || v === "no" ? v : "unclear"; };
  function verdict(b) {
    const v = REQS.map(r => reqVal(b, r.key)), rent = rentOf(b);
    if ((b.sqft != null && b.sqft < MIN_SQFT) || (rent != null && rent > RENT_CAP) || v.includes("no")) return "fail";
    return v.every(x => x === "yes") ? "all" : "check";
  }
  const regionOf = b => { const a = S.areaById.get(b.area_id); return (a && a.region) || b.region || "Los Angeles"; };
  const areaName = b => { const a = S.areaById.get(b.area_id); return a ? a.name : ""; };
  const isNew = b => b.batch === "new-oct15" || b.batch === "private-oct15";

  function haystack(b) {
    const r = b.reviews || {};
    return [b.name, b.address, areaName(b), regionOf(b), b.notes, b.special, b.packages_detail, b.owner_type, b.platform,
      r.management_company, b.landlord === "private" ? "private owner condo" : "management company", b.hoa_amenities, b.my_note]
      .filter(Boolean).join(" ").toLowerCase();
  }
  function matches(b) {
    const f = S.f, rent = rentOf(b);
    if (!f.regions.includes(regionOf(b))) return false;
    if (!f.verdicts.includes(verdict(b))) return false;
    if (!f.landlords.includes(b.landlord || "company")) return false;
    if (!f.statuses.includes(b.my_status || "new")) return false;
    if (rent != null && rent > f.maxRent) return false;
    if (b.sqft != null && b.sqft < f.minSqft) return false;
    if (f.minRep > 0 && !(repScore(b) >= f.minRep)) return false;
    if (f.hideScam && b.scam_flags) return false;
    if (f.newOnly && !isNew(b)) return false;
    for (const k of f.mustHave) if (reqVal(b, k) !== "yes") return false;
    if (S.q) { const hs = haystack(b); for (const t of S.q.split(/\s+/)) if (t && !hs.includes(t)) return false; }
    return true;
  }
  function sorted(list) {
    const k = S.sort;
    const key = {
      score: b => -(score(b) ?? -1), value: b => -((score(b) ?? 0) / (rentOf(b) || 9e9)), rent: b => rentOf(b) ?? 9e9,
      sqft: b => -(b.sqft ?? 0), ppsf: b => ppsf(b) ?? 9e9, reviews: b => -(repScore(b) ?? -1), name: b => b.name.toLowerCase(),
    }[k] || (b => 0);
    return list.slice().sort((a, b) => { const x = key(a), y = key(b); return x < y ? -1 : x > y ? 1 : (rentOf(a) ?? 0) - (rentOf(b) ?? 0); });
  }
  const visible = () => sorted(S.buildings.filter(matches));

  /* ---------------- Header ---------------- */
  function renderDates() {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    $("dates").replaceChildren(...DATES.map(d => {
      const dt = new Date(d.date + "T00:00:00"), days = Math.round((dt - today) / 864e5);
      return h("div", { class: "date" + (days >= 0 && days <= 21 ? " soon" : "") },
        h("b", { text: days >= 0 ? days + " days" : "Passed" }),
        h("span", { text: d.label + " · " + dt.toLocaleDateString("en-US", { month: "short", day: "numeric" }) }));
    }));
    $("baseline").textContent = `Renewing at The Jayne costs ${money(JAYNE.allIn)}/mo all-in`;
  }

  /* ---------------- Filters ---------------- */
  function counts(keyFn) { const m = {}; for (const b of S.buildings) { const k = keyFn(b); m[k] = (m[k] || 0) + 1; } return m; }
  function checkList(id, items, arr, onChange, countMap) {
    return h("div", { class: "checks" }, ...items.map(([key, name]) => {
      const cid = id + "-" + key;
      return h("label", { class: "check", for: cid },
        h("input", { type: "checkbox", id: cid, checked: arr.includes(key), onchange: e => { onChange(key, e.target.checked); } }),
        name, countMap ? h("small", { text: countMap[key] || 0 }) : null);
    }));
  }
  function toggleIn(arr, key, on) { const i = arr.indexOf(key); if (on && i < 0) arr.push(key); if (!on && i >= 0) arr.splice(i, 1); }
  function group(title, open, ...body) {
    return h("details", { class: "fgroup", open: open || null }, h("summary", null, h("span", { class: "label", text: title })), ...body);
  }
  function renderFilters() {
    const f = S.f;
    const rerender = () => { saveF(); renderFilters(); renderResults(); };
    const rentOut = h("output", { for: "f-rent", text: money(f.maxRent) });
    const sqOut = h("output", { for: "f-sqft", text: f.minSqft + " sq ft" });
    const repOut = h("output", { for: "f-rep", text: f.minRep ? f.minRep + "+ / 10" : "Any" });
    const totalW = FACTORS.concat(REP).reduce((t, x) => t + (Number(S.weights[x.key]) || 0), 0) || 1;
    $("filters").replaceChildren(
      h("div", { class: "fgroup" },
        h("div", { class: "fhead" }, h("label", { class: "label", for: "f-rent", text: "Max rent" }), rentOut),
